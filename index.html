<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f6feb">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="表單擷取">
<link id="touchIcon" rel="apple-touch-icon" href="">
<title>表單擷取</title>
<style>
  :root { --bg:#f2f2f7; --card:#fff; --text:#111; --sub:#6b6b70; --line:#e3e3e8; --accent:#1f6feb; --danger:#d1242f; --ok:#1a7f37; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#000; --card:#1c1c1e; --text:#f2f2f7; --sub:#98989f; --line:#38383a; --accent:#4c8dff; --danger:#ff6b6b; --ok:#3fb950; }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin:0; background:var(--bg); color:var(--text); font:16px/1.5 -apple-system, "PingFang TC", "Noto Sans TC", sans-serif; padding-bottom: calc(76px + env(safe-area-inset-bottom)); }
  header { position:sticky; top:0; z-index:5; background:var(--card); border-bottom:.5px solid var(--line); padding: calc(10px + env(safe-area-inset-top)) 16px 10px; text-align:center; font-weight:600; }
  main { max-width:560px; margin:0 auto; padding:12px 16px; }
  .hidden { display:none !important; }
  h3 { font-size:13px; font-weight:500; color:var(--sub); margin:18px 4px 6px; }
  .card { background:var(--card); border:.5px solid var(--line); border-radius:12px; overflow:hidden; }
  .row { display:flex; align-items:center; padding:0 14px; min-height:46px; border-bottom:.5px solid var(--line); }
  .row:last-child { border-bottom:0; }
  .row label { width:56px; flex:none; color:var(--sub); font-size:15px; }
  .row input, .row select { flex:1; min-width:0; border:0; background:transparent; color:var(--text); font:inherit; text-align:right; padding:10px 0; outline:none; appearance:none; -webkit-appearance:none; }
  .row input[type=checkbox] { flex:none; width:22px; height:22px; appearance:auto; -webkit-appearance:checkbox; }
  .row input::placeholder { color:var(--sub); opacity:.6; }
  button { font:inherit; border:0; border-radius:12px; padding:12px 16px; background:var(--accent); color:#fff; font-weight:500; width:100%; }
  button.secondary { background:var(--card); color:var(--accent); border:.5px solid var(--line); }
  button:active { opacity:.8; }
  .pick { display:block; text-align:center; background:var(--card); border:.5px dashed var(--line); border-radius:12px; padding:22px 14px; color:var(--accent); font-weight:500; }
  #preview { width:100%; border-radius:12px; margin-top:10px; display:block; }
  #nameCropBox { margin-top:10px; }
  #nameCrop { width:100%; border-radius:12px; border:.5px solid var(--line); background:#fff; display:block; }
  #status { font-size:14px; margin:8px 4px 0; min-height:20px; }
  #status.err { color:var(--danger); } #status.ok { color:var(--ok); } #status.busy { color:var(--sub); }
  .actions { display:flex; gap:10px; margin-top:16px; }
  nav { position:fixed; left:0; right:0; bottom:0; display:flex; background:var(--card); border-top:.5px solid var(--line); padding-bottom:env(safe-area-inset-bottom); }
  nav button { background:transparent; color:var(--sub); border-radius:0; padding:12px 0 10px; font-size:13px; }
  nav button.on { color:var(--accent); }
  .rec { padding:12px 14px; border-bottom:.5px solid var(--line); }
  .rec:last-child { border-bottom:0; }
  .rec .t { display:flex; justify-content:space-between; font-weight:500; }
  .rec .m { color:var(--sub); font-size:13px; }
  .rec .d { color:var(--danger); font-size:13px; background:none; border:0; padding:0; width:auto; }
  .empty { text-align:center; color:var(--sub); padding:36px 0; }
  .note { color:var(--sub); font-size:13px; margin:14px 4px; }
</style>
</head>
<body>
<header id="title">表單擷取</header>

<main>
  <section id="tab-new">
    <label class="pick" for="file">拍照或選擇圖片</label>
    <input id="file" type="file" accept="image/*" class="hidden">
    <img id="preview" class="hidden" alt="預覽">
    <div id="status"></div>

    <div id="nameCropBox" class="hidden">
      <h3>姓名區域（手寫請對照後修改）</h3>
      <canvas id="nameCrop"></canvas>
    </div>

    <h3>辨識結果（可修改）</h3>
    <div class="card">
      <div class="row"><label>來源</label>
        <select id="source">
          <option value="">未選</option><option>REF</option><option>INS</option><option>公司未購</option><option>私人</option><option>其他</option>
        </select></div>
      <div class="row"><label>姓名</label><input id="name" placeholder="姓名"></div>
      <div class="row"><label>單號</label><input id="orderNo" placeholder="Z000000" autocapitalize="characters"></div>
    </div>

    <h3>自行填寫</h3>
    <div class="card">
      <div class="row"><label>名單</label><input id="list" placeholder="輸入名單"></div>
      <div class="row"><label>下機</label><input id="machineOff" placeholder="輸入下機"></div>
      <div class="row"><label>下卡</label><input id="cardOff" placeholder="輸入下卡"></div>
    </div>

    <h3>選項</h3>
    <div class="card">
      <div class="row"><label>狀況</label>
        <select id="condition"><option>正常</option><option>公獨</option><option>婆獨</option><option>單親</option><option>單身</option><option>家人代看</option></select></div>
      <div class="row"><label>備註</label><input id="note" placeholder="輸入備註"></div>
      <div class="row"><label>招募</label>
        <select id="recruit"><option>沒興趣</option><option>有興趣</option></select></div>
    </div>

    <div class="actions">
      <button id="save">儲存</button>
      <button id="copy" class="secondary">複製文字</button>
    </div>
    <div class="actions">
      <button id="shareAll" style="background:#06c755">分享至 LINE（圖片＋文字）</button>
    </div>
    <div class="actions">
      <button id="shareText" class="hidden" style="background:#06c755">接著分享文字到 LINE</button>
    </div>
  </section>

  <section id="tab-list" class="hidden">
    <div class="actions" style="margin-top:0">
      <button id="csv" class="secondary">匯出 CSV</button>
    </div>
    <h3>已儲存紀錄</h3>
    <div class="card" id="records"></div>
  </section>

  <section id="tab-set" class="hidden">
    <h3>複製格式</h3>
    <div class="card">
      <div class="row"><label style="width:auto;flex:1">複製單號時去掉開頭的 Z</label><input id="stripZ" type="checkbox"></div>
    </div>
    <p class="note">本 App 完全在手機上辨識，不需要 API Key，也不會把圖片傳到任何伺服器。第一次辨識需下載約十幾 MB 的語言資料，之後會快取。手寫姓名 Tesseract 通常讀不準，所以會在上方顯示姓名區域的截圖，請對照後自行輸入。紀錄只存在這支手機的瀏覽器，清除網站資料或換手機會消失，請定期匯出 CSV。</p>
  </section>
</main>

<nav>
  <button data-tab="new" class="on">新增</button>
  <button data-tab="list">紀錄</button>
  <button data-tab="set">設定</button>
</nav>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
